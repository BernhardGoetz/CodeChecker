name: Website (GitHub Pages)

# Baut die Website aus site/ und den Markdown-Dokumenten (scripts/build-site.mjs)
# und veröffentlicht sie unter https://bernhardgoetz.github.io/CodeChecker/.
# Voraussetzung: Settings -> Pages -> Source "GitHub Actions".
# Kein Build der App; die Download-Links folgen der Version in
# src-tauri/tauri.conf.json.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/build-site.mjs"
      - "scripts/check-site-links.mjs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/icons/**"
      - "package*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

# Nur eine Veröffentlichung gleichzeitig; eine laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Website bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Gebraucht wird nur marked; Install-Skripte der übrigen Pakete laufen nicht.
      - run: npm ci --ignore-scripts
      - name: Website bauen
        run: npm run build:site
      - name: Links prüfen
        run: npm run check:site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Website veröffentlichen
      id-token: write # OIDC-Token für deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
